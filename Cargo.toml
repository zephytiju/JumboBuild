[package]
name = "jumbo-build"
version = "1.0.0"
edition = "2021"
description = "Juntai internal unified build tool"

[[bin]]
name = "jumbo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
colored = "2"
git2 = "0.20"
walkdir = "2"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tar = "0.4.46"
flate2 = "1.1.10"

[dev-dependencies]
clap-markdown = "0.1.5"
# Integration tests build tarball fixtures with the same codecs the
# unpack path uses.
flate2 = "1.1.10"
tar = "0.4.46"
