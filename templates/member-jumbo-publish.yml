# Member forwarder for jumbo publication (Jumbo Build & Versioning Standard,
# section 3.5 "Executors and the Publication Contract").
#
# This is a TEMPLATE for member repositories — do not edit it here and do not
# expect it to run inside JumboBuild: it lives outside .github/workflows so
# GitHub Actions never picks it up in this repository.
#
# How to adopt (see docs/jumbo-publish.md in zephytiju/JumboBuild):
#   1. Copy this file into your repository as
#      .github/workflows/jumbo-publish.yml (the file name is yours to choose;
#      only the location is fixed).
#   2. Replace <ref> below with the zephytiju/JumboBuild ref you release
#      with — a tag or a full commit SHA (pinning the ref also pins the jumbo
#      binary this workflow builds, because the reusable workflow builds jumbo
#      from the commit its file was called at).
#   3. Nothing else. This forwarder carries NO release logic: every release
#      step (lock, fingerprint, dedup, promote, publish on bump, index
#      append, opt-in public registry publication) is owned by the reusable
#      jumbo-publish workflow. If your repository needs release steps beyond
#      calling this workflow, that is a design change — stop and return to
#      the Jumbo Build & Versioning Standard first.
#
# Secrets flow in with `secrets: inherit` from your repository/org settings:
# JUNTAI_GITHUB_ARTIFACT_TOKEN and JUNTAI_INDEX_TOKEN are required, and
# PYPI_TOKEN / NPM_TOKEN only when the reusable workflow is called with
# publish-to-public-registry enabled. Tokens are consumed via secrets and
# environment only — never as literals in any file.
name: jumbo publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jumbo-publish:
    uses: zephytiju/JumboBuild/.github/workflows/jumbo-publish.yml@<ref>
    secrets: inherit
    # Reusable workflows cannot elevate permissions; the GitHub Release and
    # the tag it creates live on THIS repository, so the calling job grants
    # contents: write. No other permission is needed.
    permissions:
      contents: write
