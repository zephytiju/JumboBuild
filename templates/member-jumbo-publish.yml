# Member forwarder for jumbo publication (Jumbo Build & Versioning Standard,
# section 3.5 "Executors and the Publication Contract").
#
# This is a TEMPLATE for member repositories — do not edit it here and do not
# expect it to run inside JumboBuild: it lives outside .github/workflows so
# GitHub Actions never picks it up in this repository.
#
# How to adopt (see docs/member-onboarding.md in zephytiju/JumboBuild for the
# full walkthrough; docs/jumbo-publish.md for the executor contract):
#   1. Copy this file into your repository as
#      .github/workflows/jumbo-publish.yml (the file name is yours to choose;
#      only the location is fixed).
#   2. Replace both <ref> occurrences below with the zephytiju/JumboBuild
#      ref you release with — a tag or a full commit SHA. The uses: line
#      picks the workflow version; the jumbobuild-ref input pins the ref the
#      reusable workflow builds the jumbo binary from (under workflow_call
#      GitHub does not expose the uses: ref to the called workflow, so the
#      input is the authoritative pin — keep both identical).
#   3. Nothing else. This forwarder carries NO release logic: every release
#      step (lock, fingerprint, dedup, promote, publish on bump, index
#      append, opt-in public registry publication) is owned by the reusable
#      jumbo-publish workflow. If your repository needs release steps beyond
#      calling this workflow, that is a design change — stop and return to
#      the Jumbo Build & Versioning Standard first.
#
# Secrets flow in with `secrets: inherit` from your repository/org settings.
# Index/artifact authentication resolves in this order (docs/jumbo-publish.md
# in zephytiju/JumboBuild has the details):
#   1. PREFERRED — the org CI GitHub App pair JUNTAI_CI_APP_ID +
#      JUNTAI_CI_APP_PRIVATE_KEY: the executor mints a short-lived
#      installation token (contents read+write, scoped to JumboBuild and the
#      index repository, revoked at job end) for the checkouts, the index
#      fetch, and the index append. No long-lived credential is stored.
#   2. FALLBACK — the static secrets JUNTAI_GITHUB_ARTIFACT_TOKEN (read on
#      JumboBuild + JumboIndex) and JUNTAI_INDEX_TOKEN (contents:write on
#      JumboIndex). If neither the App pair nor these secrets exist, the run
#      fails fast with an actionable error naming both options.
#   PYPI_TOKEN / NPM_TOKEN are needed only when the reusable workflow is
#   called with publish-to-public-registry enabled. Tokens are consumed via
#   secrets and environment only — never as literals in any file.
name: jumbo publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA of this repository to release (default: the triggering commit)"
        type: string
        default: ""

jobs:
  jumbo-publish:
    uses: zephytiju/JumboBuild/.github/workflows/jumbo-publish.yml@<ref>
    secrets: inherit
    with:
      # The same JumboBuild ref the uses: line pins — the reusable workflow
      # builds the jumbo binary from exactly this ref.
      jumbobuild-ref: <ref>
      # Release-commit passthrough (the executor's documented `commit`
      # input): empty on push runs and on plain dispatches means the
      # triggering commit; an explicit dispatch input releases that exact
      # existing commit — the re-release path a fingerprint-equal dedup
      # re-run uses. The executor itself defaults an empty value to
      # GITHUB_SHA, so push behavior is unchanged.
      commit: ${{ inputs.commit }}
    # Reusable workflows cannot elevate permissions; the calling job must
    # grant what the called workflow needs. contents: write covers the
    # GitHub Release and its tag, which live on THIS repository. The
    # reusable workflow also declares packages: write (the GHCR push, only
    # exercised with publish-image: true), and reusable workflows cannot
    # elevate permissions — so this job grants both.
    permissions:
      contents: write
      packages: write
