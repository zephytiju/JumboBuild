# Reusable jumbo publication workflow (Jumbo Build & Versioning Standard, §3.5
# "Executors and the Publication Contract").
#
# Jumbo publication is executor-agnostic: this workflow runs the SAME jumbo
# commands the CircleCI umbrella pipelines run — lock → fingerprint → dedup →
# promote — and a public repository releases to jumbo by calling it with NO
# per-repo workflow logic. On a promotion (publish-on-bump) it first
# materializes the recorded artifacts of the manifest's internal
# dependencies into deps/ (scripts/jumbo_publish_materialize_deps.sh —
# real wheels replace the resolution-only stubs the lock generation
# wrote, so the build never sees a stub on any uv/npm version) and then
# builds the artifacts at the jumbo-computed version, publishes them as a
# GitHub Release
# on the CALLER repository, appends the JumboIndex record per that
# repository's docs/APPEND-PROTOCOL.md, and (opt-in, default off) republishes
# to the public registry so external consumers keep being served — driven by
# the jumbo-computed version. Image-producing packages opt in with
# publish-image: true — the service image (Dockerfile at the repository
# root) is built from the same release commit and pushed to GHCR, and the
# pushed digest is verified against the registry (a digest mismatch aborts
# the build before any index append, standard §3.7 failure behavior) before
# being recorded as the record's imageDigest. A fingerprint hit (dedup)
# skips the build in this executor exactly as in CircleCI: the recorded
# artifact is pulled, SHA-256 verified, and the run ends without publishing.
#
# Caller usage (see docs/jumbo-publish.md for the full contract):
#
#   jobs:
#     jumbo-publish:
#       uses: zephytiju/JumboBuild/.github/workflows/jumbo-publish.yml@<ref>
#       secrets: inherit
#       with:
#         jumbobuild-ref: <ref>   # the same JumboBuild ref the uses: line pins
#       permissions:
#         contents: write
#         packages: write   # only needed with publish-image: true (GHCR push)
#
# Required secrets (org-level, passed with `secrets: inherit`). The workflow
# resolves the index/artifact authentication at run time, in this order:
#
#   1. PREFERRED — the org CI GitHub App pair:
#        JUNTAI_CI_APP_ID + JUNTAI_CI_APP_PRIVATE_KEY
#      Two short-lived installation tokens are minted at run time (both
#      revoked when the job ends): (a) a contents read+write token scoped to
#      exactly zephytiju/JumboBuild and the index repository, used for the
#      JumboBuild checkout, the JumboIndex fetch, and the index append; and
#      (b) an org-wide contents:read token for dependency materialization,
#      which fetches recorded release assets and source-fallback trees from
#      PRIVATE member repositories the narrowly scoped token (a) cannot
#      read. No long-lived credential is stored anywhere; the private key
#      flows only from its secret into the minting action — never echoed,
#      logged, or written to a file.
#   2. FALLBACK — the static token secrets (backward compatible):
#        JUNTAI_GITHUB_ARTIFACT_TOKEN - reads the private JumboBuild checkout
#          and clones the private JumboIndex repository (the caller's default
#          GITHUB_TOKEN cannot cross repository boundaries); also the
#          dependency-fetch fallback credential when the App pair is absent.
#        JUNTAI_INDEX_TOKEN           - pushes the index append to JumboIndex
#          (a GitHub App or user token with contents:write on
#          zephytiju/JumboIndex).
#   3. NEITHER PATH AVAILABLE — the workflow fails fast with an actionable
#      error naming both options (before any build work).
#
#   PYPI_TOKEN / NPM_TOKEN       - only when publish-to-public-registry is
#     enabled; never referenced in this file as a literal, only via secrets.
#   The GHCR push uses the caller's own GITHUB_TOKEN with packages: write;
#   no additional secret exists or is read for images.
#
# Credentials enter exclusively through secrets/env. No credential literals
# appear in this workflow, and outbound traffic goes to github.com plus the
# language registries (pypi.org / registry.npmjs.org) the standard build
# tools and the opt-in public publish use.
name: jumbo publish

on:
  workflow_call:
    inputs:
      commit:
        description: "Commit SHA of the caller repository to release (default: the triggering commit)"
        type: string
        default: ""
      jumbobuild-ref:
        description: "JumboBuild ref (tag, branch, or full SHA) to build jumbo from — pin the same ref the uses: line uses. Required when called with workflow_call; empty falls back to this workflow's own ref (direct runs on JumboBuild)."
        type: string
        default: ""
      ecosystem:
        description: "python | npm | auto (detected from the package manifest)"
        type: string
        default: "auto"
      publish-to-public-registry:
        description: "Also publish to PyPI/npm for external consumers, driven by the jumbo-computed version"
        type: boolean
        default: false
      publish-image:
        description: "Build and push the service image (Dockerfile at the repository root) to GHCR; the verified digest is recorded as the index record's imageDigest"
        type: boolean
        default: false
      index-repository:
        description: "JumboIndex repository (owner/name)"
        type: string
        default: "zephytiju/JumboIndex"
    outputs:
      package:
        description: "Package the decision was computed for"
        value: ${{ jobs.publish.outputs.package }}
      version:
        description: "Promoted version (or the reused version on a dedup hit)"
        value: ${{ jobs.publish.outputs.version }}
      bump:
        description: "none | minor | patch | bootstrap"
        value: ${{ jobs.publish.outputs.bump }}
      published:
        description: "'true' when artifacts were published and the index appended"
        value: ${{ jobs.publish.outputs.published }}
      reused:
        description: "'true' when a fingerprint hit skipped the build"
        value: ${{ jobs.publish.outputs.reused }}
      image-digest:
        description: "Verified GHCR image digest (sha256:...) when publish-image was enabled and the image was pushed; empty otherwise"
        value: ${{ jobs.publish.outputs.image-digest }}
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA of the caller repository to release (default: the triggering commit)"
        type: string
        default: ""
      jumbobuild-ref:
        description: "JumboBuild ref (tag, branch, or full SHA) to build jumbo from; empty uses the ref this workflow was dispatched at"
        type: string
        default: ""
      ecosystem:
        description: "python | npm | auto (detected from the package manifest)"
        type: string
        default: "auto"
      publish-to-public-registry:
        description: "Also publish to PyPI/npm for external consumers, driven by the jumbo-computed version"
        type: boolean
        default: false
      publish-image:
        description: "Build and push the service image (Dockerfile at the repository root) to GHCR; the verified digest is recorded as the index record's imageDigest"
        type: boolean
        default: false
      index-repository:
        description: "JumboIndex repository (owner/name)"
        type: string
        default: "zephytiju/JumboIndex"

# The GitHub Release carrying the artifacts is created on the caller
# repository; reusable workflows cannot elevate permissions, so the caller
# must grant contents: write on the calling job. Image publication (opt-in
# publish-image) additionally needs the caller to grant packages: write:
# the called workflow can only downgrade, never elevate, what the calling
# workflow passes to the GITHUB_TOKEN.
permissions:
  contents: write
  packages: write

# Publication runs queue per ref (never cancelled mid-flight); the index
# append protocol makes concurrent runs converge idempotently regardless.
concurrency:
  group: jumbo-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Executor identity recorded in every index record this workflow appends
  # (JumboIndex schema/record.schema.json: known executor values).
  JUMBO_EXECUTOR: jumbo-publish-github-actions

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.identity.outputs.package }}
      version: ${{ steps.identity.outputs.version }}
      bump: ${{ steps.identity.outputs.bump }}
      published: ${{ steps.release.outputs.published }}
      reused: ${{ steps.dedup.outputs.duplicate }}
      image-digest: ${{ steps.image-verify.outputs.digest }}
    steps:
      - name: Resolve the release commit and the JumboBuild coordinates
        id: coords
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_JUMBOBUILD_REF: ${{ inputs.jumbobuild-ref }}
        run: |
          set -euo pipefail
          commit="${INPUT_COMMIT:-${GITHUB_SHA}}"
          # JumboBuild coordinates: the repository owning THIS workflow file,
          # and the ref jumbo is built from. GITHUB_WORKFLOW_REF cannot
          # supply either: it names the workflow that TRIGGERED the run, so
          # under workflow_call it is the CALLER's file and ref
          # (e.g. member-repo/.github/workflows/jumbo-release.yml@refs/heads/main)
          # — trusting it made this workflow check out the caller repository
          # as JumboBuild and fail building jumbo. Reusable callers therefore
          # pin the build ref explicitly via the jumbobuild-ref input (the
          # same ref their uses: line pins). The implicit GITHUB_WORKFLOW_REF
          # value is trusted only for DIRECT runs on the JumboBuild repository
          # itself, where it genuinely is this workflow's file and ref.
          build_repo="zephytiju/JumboBuild"
          build_ref="${INPUT_JUMBOBUILD_REF:-}"
          if [[ -z "$build_ref" ]]; then
            workflow_ref="${GITHUB_WORKFLOW_REF:?GITHUB_WORKFLOW_REF is required}"
            repo_and_path="${workflow_ref%@*}"
            called_repo="${repo_and_path%%/.github/*}"
            if [[ "$called_repo" == "$build_repo" ]]; then
              build_ref="${workflow_ref##*@}"
            else
              echo "::error title=jumbo coordinates::the jumbobuild-ref input is required when jumbo-publish is called with workflow_call (GITHUB_WORKFLOW_REF names the caller workflow ${called_repo}, not ${build_repo}). Pin the same JumboBuild ref the uses: line uses, e.g. jumbobuild-ref: main." >&2
              exit 1
            fi
          fi
          if [[ -z "$build_ref" || ! "$build_repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "invalid JumboBuild coordinates: repo=${build_repo} ref=${build_ref}" >&2
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "build-repo=${build_repo}"
            echo "build-ref=${build_ref}"
          } >> "$GITHUB_OUTPUT"
          # jumbo command outputs live OUTSIDE the caller checkout: the
          # promotion clean-tree guard refuses a tree dirtied by anything
          # except jumbo's own generated lock and deps/ overlays.
          jumbo_state="${RUNNER_TEMP}/jumbo-state"
          mkdir -p "$jumbo_state"
          echo "JUMBO_OUT=${jumbo_state}" >> "$GITHUB_ENV"
          echo "Releasing ${GITHUB_REPOSITORY}@${commit} with jumbo from ${build_repo}@${build_ref}"

      # 1. Resolve the index/artifact authentication path. Preferred: the org
      #    CI GitHub App pair (JUNTAI_CI_APP_ID + JUNTAI_CI_APP_PRIVATE_KEY)
      #    — a short-lived installation token is minted in the next step and
      #    used for the JumboBuild checkout, the JumboIndex fetch, and the
      #    index append, so no long-lived credential is stored anywhere.
      #    Backward-compatible fallback: the static JUNTAI_GITHUB_ARTIFACT_
      #    TOKEN (checkouts + index fetch) and JUNTAI_INDEX_TOKEN (index
      #    append) secrets. Neither path available: fail fast here with an
      #    actionable error naming both options — the default GITHUB_TOKEN
      #    cannot read another repository, so continuing would only fail
      #    later at the index clone (the failure mode this resolution
      #    replaces). Presence checks only: no secret VALUE enters this
      #    step, and the App private key flows exclusively from its secret
      #    into the minting action below.
      - name: Resolve the index/artifact authentication path
        id: auth
        env:
          INDEX_REPOSITORY: ${{ inputs.index-repository }}
        run: |
          set -euo pipefail
          app_id_present='${{ secrets.JUNTAI_CI_APP_ID != '' }}'
          app_key_present='${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY != '' }}'
          artifact_token_present='${{ secrets.JUNTAI_GITHUB_ARTIFACT_TOKEN != '' }}'
          index_token_present='${{ secrets.JUNTAI_INDEX_TOKEN != '' }}'
          if [[ ! "$INDEX_REPOSITORY" =~ ^([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)$ ]]; then
            echo "::error title=jumbo index auth::index-repository must be owner/name (got: ${INDEX_REPOSITORY})" >&2
            exit 1
          fi
          {
            echo "index-owner=${BASH_REMATCH[1]}"
            echo "index-name=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"
          if [[ "$app_id_present" == true && "$app_key_present" == true ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "index auth: GitHub App pair present - a short-lived installation token will be minted for zephytiju/JumboBuild and ${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          elif [[ "$artifact_token_present" == true ]]; then
            if [[ "$app_id_present" == true || "$app_key_present" == true ]]; then
              echo "::warning title=jumbo index auth::only one of JUNTAI_CI_APP_ID / JUNTAI_CI_APP_PRIVATE_KEY is set - falling back to the static JUNTAI_GITHUB_ARTIFACT_TOKEN / JUNTAI_INDEX_TOKEN secrets (set both to use the preferred App path)"
            fi
            if [[ "$index_token_present" != true ]]; then
              echo "::warning title=jumbo index auth::JUNTAI_INDEX_TOKEN is not set - runs that publish will fail at the index append"
            fi
            echo "mode=static" >> "$GITHUB_OUTPUT"
            echo "index auth: using the static JUNTAI_GITHUB_ARTIFACT_TOKEN (checkouts + index fetch) and JUNTAI_INDEX_TOKEN (index append)"
          else
            echo "::error title=jumbo index auth::no index/artifact credentials are available to this run. Configure one of: (1) the org CI GitHub App pair - secrets JUNTAI_CI_APP_ID and JUNTAI_CI_APP_PRIVATE_KEY (preferred: short-lived installation tokens, no long-lived credential is stored); or (2) the static secrets JUNTAI_GITHUB_ARTIFACT_TOKEN (read access to zephytiju/JumboBuild and the index repository) and JUNTAI_INDEX_TOKEN (contents:write on the index repository). See docs/jumbo-publish.md in zephytiju/JumboBuild." >&2
            exit 1
          fi

      # 2. Mint the installation token (App path only). The minting action is
      #    pinned to a full commit SHA; the private key flows from its secret
      #    into the action input and nowhere else (never echoed, logged, or
      #    written to a file). permission-contents: write downgrades the
      #    minted token to exactly contents read+write on the two
      #    repositories the executor touches — no extra permissions — and
      #    the action revokes the token when the job ends.
      - name: Mint the GitHub App installation token
        id: app-token
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.JUNTAI_CI_APP_ID }}
          private-key: ${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.auth.outputs.index-owner }}
          repositories: JumboBuild,${{ steps.auth.outputs.index-name }}
          permission-contents: write

      # 2b. Mint the org-wide dependency read token (App path only).
      #     Dependency materialization (step 8) fetches recorded release
      #     assets and source-fallback trees from PRIVATE member
      #     repositories — arbitrary repositories of the organization,
      #     unknowable before `jumbo lock` resolves the manifest — so its
      #     credential cannot be pre-scoped to the two repositories the
      #     executor itself touches. The org CI app is installed on every
      #     organization repository, so a token minted with NO repository
      #     filter covers exactly what a dependency fetch may need,
      #     downgraded to contents: read only and revoked when the job
      #     ends. Without it the fetches run anonymous, and github.com
      #     release-asset URLs AND codeload tarball URLs answer 404 for
      #     private repositories even though the run holds valid
      #     credentials — the defect this token exists to fix (evidence:
      #     PrismPipelineFluxboardMicroUI run 36819957831, source fallback
      #     → anonymous codeload 404 for private zephytiju/PrismReact).
      - name: Mint the org-wide dependency read token
        id: deps-token
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.JUNTAI_CI_APP_ID }}
          private-key: ${{ secrets.JUNTAI_CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.auth.outputs.index-owner }}
          permission-contents: read

      # 3. The caller repository at the triggering commit. Promotion only
      #    happens on a clean attributable tree: checkout gives exactly the
      #    release commit, and persist-credentials keeps no token in the
      #    local git config (later git/gh calls pass their own tokens).
      - name: Check out the caller repository at the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coords.outputs.commit }}
          persist-credentials: false

      # 4. JumboBuild at the ref the caller pinned (jumbobuild-ref; direct
      #    runs on JumboBuild fall back to the ref this workflow lives at).
      #    Cross-repository access needs the minted installation token or
      #    the static artifact token; the caller's default GITHUB_TOKEN
      #    cannot cross repository boundaries (the auth resolution above
      #    fails fast when neither credential exists).
      - name: Check out JumboBuild at the pinned ref
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.coords.outputs.build-repo }}
          ref: ${{ steps.coords.outputs.build-ref }}
          path: jumbobuild
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || secrets.JUNTAI_GITHUB_ARTIFACT_TOKEN }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restore/build happen at the pre-move path (see the move step below);
      # rust-cache's post-save looks for the directory there and skips the
      # target-dir save when it is gone — a perf cost, never a correctness
      # issue (the cargo-home part of the cache still saves).
      - name: Cache the cargo build of jumbo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: jumbobuild

      - name: Build jumbo from the pinned JumboBuild commit
        run: cargo build --release --locked
        working-directory: jumbobuild

      # The self-checkout must not remain inside the caller's working tree:
      # actions/checkout only accepts paths under GITHUB_WORKSPACE, but the
      # promotion guard (§2.3) refuses dirty trees, and an untracked
      # jumbobuild/ directory inside the caller repository dirties EVERY
      # caller tree (including JumboBuild's own on direct runs — the guard
      # counts reported paths regardless of gitignore status). Same-volume
      # rename, so the built binary moves with it in one step.
      - name: Move the JumboBuild checkout out of the caller working tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jumbo-build"
          mv "$GITHUB_WORKSPACE/jumbobuild" "$RUNNER_TEMP/jumbo-build/jumbobuild"

      - name: Put jumbo on PATH
        run: echo "$RUNNER_TEMP/jumbo-build/jumbobuild/target/release" >> "$GITHUB_PATH"

      # uv runs the Python side of the standard build (lock, build,
      # publish). Unconditional so ecosystem detection stays jumbo's job.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # 5. The Jumbo index (private). Authenticated with the minted
      #    installation token when the App pair is present, else the static
      #    JUNTAI_GITHUB_ARTIFACT_TOKEN — the auth resolution above fails
      #    fast when neither exists (the caller's default GITHUB_TOKEN can
      #    never read another repository).
      - name: Fetch the Jumbo index
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.JUNTAI_GITHUB_ARTIFACT_TOKEN }}
          INDEX_REPOSITORY: ${{ inputs.index-repository }}
        run: |
          set -euo pipefail
          : "${INDEX_REPOSITORY:?input index-repository is required}"
          index_dir="${RUNNER_TEMP}/jumbo-index"
          gh repo clone "$INDEX_REPOSITORY" "$index_dir"
          echo "JUMBO_INDEX_PATH=${index_dir}" >> "$GITHUB_ENV"
          echo "JUMBO_INDEX_REPOSITORY=${INDEX_REPOSITORY}" >> "$GITHUB_ENV"

      # 6. The standard jumbo release steps — identical commands to the
      #    CircleCI executor, identical outputs. jumbo prefixes its stdout
      #    with progress lines; `sed -n '/^{/,$p'` keeps the JSON document
      #    (pipefail still surfaces a jumbo failure).
      - name: jumbo lock (resolve and generate the language lock)
        run: |
          set -euo pipefail
          jumbo lock | sed -n '/^{/,$p' > "$JUMBO_OUT/lock.json"
          jq -e '.lock' "$JUMBO_OUT/lock.json" > /dev/null
          cat "$JUMBO_OUT/lock.json"

      - name: jumbo fingerprint (input fingerprint of this build)
        run: |
          set -euo pipefail
          jumbo fingerprint | sed -n '/^{/,$p' > "$JUMBO_OUT/fingerprint.json"
          jq -e '.fingerprint' "$JUMBO_OUT/fingerprint.json" > /dev/null
          cat "$JUMBO_OUT/fingerprint.json"

      - name: jumbo dedup (build-or-reuse decision)
        id: dedup
        run: |
          set -euo pipefail
          jumbo dedup | sed -n '/^{/,$p' > "$JUMBO_OUT/dedup.json"
          cat "$JUMBO_OUT/dedup.json"
          {
            echo "duplicate=$(jq -r '.duplicate' "$JUMBO_OUT/dedup.json")"
            echo "action=$(jq -r '.action' "$JUMBO_OUT/dedup.json")"
            echo "reuse_version=$(jq -r '.matchedRecord.record.version // ""' "$JUMBO_OUT/dedup.json")"
          } >> "$GITHUB_OUTPUT"

      # 7. Fingerprint hit: pull the recorded artifact (exact URL,
      #    SHA-256 verified) into dist/ and stop — no build, no publish,
      #    no index append. This is the skip-build path either executor
      #    takes. The step exports the caller's own GITHUB_TOKEN: on a
      #    PRIVATE repository the recorded
      #    github.com/<o>/<r>/releases/download/... URL answers 404 even
      #    WITH an Authorization header — GitHub serves private release
      #    assets only through the authenticated api.github.com asset
      #    route, and jumbo's fetch layer resolves the asset there when
      #    the direct URL 404s. The caller's token can always read the
      #    release this workflow created on the caller repository; public
      #    assets never need it (they 302 from the recorded URL), and the
      #    token enters only through the environment — never a log line
      #    or a command line.
      - name: Pull the recorded artifact (fingerprint hit - build skipped)
        if: steps.dedup.outputs.duplicate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jumbo dedup --materialize --dist-dir dist | sed -n '/^{/,$p' > "$JUMBO_OUT/dedup-materialized.json"
          cat "$JUMBO_OUT/dedup-materialized.json"
          echo "::notice title=jumbo dedup::identical inputs already recorded as v${{ steps.dedup.outputs.reuse_version }} - artifact pulled, build skipped"

      - name: jumbo promote (auto-promotion decision; refuses a dirty tree)
        id: promote
        if: steps.dedup.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          jumbo promote | sed -n '/^{/,$p' > "$JUMBO_OUT/promote.json"
          cat "$JUMBO_OUT/promote.json"
          {
            echo "package=$(jq -r '.package' "$JUMBO_OUT/promote.json")"
            echo "version=$(jq -r '.nextVersion' "$JUMBO_OUT/promote.json")"
            echo "bump=$(jq -r '.bump' "$JUMBO_OUT/promote.json")"
            echo "publish_required=$(jq -r '.publishRequired' "$JUMBO_OUT/promote.json")"
            echo "ecosystem=$(jq -r '.ecosystem' "$JUMBO_OUT/promote.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Record the release identity
        id: identity
        if: steps.dedup.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          ecosystem="${{ inputs.ecosystem }}"
          if [[ "$ecosystem" == "auto" ]]; then
            ecosystem="${{ steps.promote.outputs.ecosystem }}"
          fi
          case "$ecosystem" in
            python|npm) ;;
            *) echo "unsupported ecosystem: ${ecosystem}" >&2; exit 1 ;;
          esac
          {
            echo "ecosystem=${ecosystem}"
            echo "package=${{ steps.promote.outputs.package }}"
            echo "version=${{ steps.promote.outputs.version }}"
            echo "bump=${{ steps.promote.outputs.bump }}"
          } >> "$GITHUB_OUTPUT"

      # 8. Build path: materialize the recorded artifacts of the manifest's
      #    internal dependencies BEFORE any build tool runs. `jumbo lock`
      #    writes resolution-only stubs under deps/<slug>/ — enough to
      #    resolve and fingerprint, never buildable (a build backend
      #    invoked on a stub aborts, e.g. hatchling "Unable to determine
      #    which files to ship"). This step replaces each stub with the
      #    recorded release artifact (exact URL, SHA-256 verified) — or
      #    the real repository source at the recorded commit when the
      #    artifact cannot be used — and repoints the manifest at it, so
      #    the build consumes real wheels/tarballs on any uv/npm version.
      #    The dedup-reuse path above is untouched: it pulls its own
      #    recorded artifact into dist/ and never builds. The step is the
      #    same script the build-path CI check exercises
      #    (jumbo-publish-build-path-check.yml).
      - name: Materialize the recorded dependency artifacts (build path)
        id: deps
        if: steps.promote.outputs.publish_required == 'true'
        env:
          # Dependency fetches must be AUTHENTICATED: recorded asset URLs
          # on private repositories answer 404 to anonymous requests (the
          # asset then resolves through jumbo's authenticated
          # api.github.com route, which needs this token), and a source
          # fallback fetches the codeload tarball, which answers 404
          # anonymously for private repositories outright. Preferred
          # credential: the org CI app's org-wide read-only installation
          # token; then the static artifact token; then the caller's own
          # GITHUB_TOKEN (public dependencies only — it cannot cross
          # repository boundaries). jumbo reads GITHUB_TOKEN/GH_TOKEN from
          # its environment; the value enters only through the environment.
          GH_TOKEN: ${{ steps.deps-token.outputs.token || secrets.JUNTAI_GITHUB_ARTIFACT_TOKEN || github.token }}
        run: |
          bash "$RUNNER_TEMP/jumbo-build/jumbobuild/scripts/jumbo_publish_materialize_deps.sh" "${{ steps.identity.outputs.ecosystem }}"

      # 9. Publish on bump: build the artifacts at the jumbo-computed
      #    version (the manifest's own version declares only the major;
      #    minor/patch are pipeline-owned, so the version for this build is
      #    set from the promotion decision before building). The
      #    dependencies it declares are already materialized under deps/.
      #    npm runs the package's standard build BEFORE packing (the
      #    node.rs pipeline: refresh the lock against the materialized
      #    manifest, clean-install it, run the build script when one is
      #    configured) — packing the bare tree released source-only stubs
      #    (package.json + README), which is the defect this fixes (proof:
      #    @zephytiju/software-development-cicd-interfaces@1.0.0).
      - name: Set up node (npm build path)
        if: steps.identity.outputs.ecosystem == 'npm' && steps.promote.outputs.publish_required == 'true'
        uses: actions/setup-node@v5
      - name: Build the artifacts at the jumbo-computed version
        id: build
        if: steps.promote.outputs.publish_required == 'true'
        env:
          JUMBO_VERSION: ${{ steps.promote.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ steps.identity.outputs.ecosystem }}" in
            python)
              uv version "$JUMBO_VERSION"
              uv build --out-dir dist
              ;;
            npm)
              npm version "$JUMBO_VERSION" --no-git-tag-version --allow-same-version
              # The package's standard build (the node.rs pipeline). The
              # materialization step rewrote dependency references in
              # package.json, so the lock is refreshed against the
              # materialized manifest before the clean install.
              npm install --package-lock-only --ignore-scripts
              npm ci
              if jq -e '.scripts.build' package.json > /dev/null; then
                npm run build
              fi
              # Pack into a staging directory OUTSIDE the build output
              # (the package's own build usually writes dist/). The built
              # bytes travel INSIDE the tarball (files: ["dist", ...]), so
              # dist/ is reset afterwards to carry exactly the release
              # artifact — no build outputs mixed into the release assets.
              pack_dir="$JUMBO_OUT/npm-pack"
              mkdir -p "$pack_dir"
              npm pack --pack-destination "$pack_dir"
              rm -rf dist
              mkdir -p dist
              mv "$pack_dir"/*.tgz dist/
              ;;
            *) echo "unsupported ecosystem: ${{ steps.identity.outputs.ecosystem }}" >&2; exit 1 ;;
          esac
          ls -l dist

      - name: Compute SHA-256 checksums of the artifacts
        id: checksums
        if: steps.promote.outputs.publish_required == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          case "${{ steps.identity.outputs.ecosystem }}" in
            python) primary="$(find . -maxdepth 1 -type f -name '*.whl' | sort | head -n 1)" ;;
            npm)   primary="$(find . -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)" ;;
          esac
          primary="${primary#./}"
          {
            echo "asset-name=${primary}"
            echo "asset-sha256=$(sha256sum "$primary" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # 10. The GitHub Release on the CALLER repository (the artifact
      #    storage of the standard: language artifacts are release assets
      #    on the package repository).
      - name: Publish the GitHub Release on the caller repository
        id: release
        if: steps.promote.outputs.publish_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JUMBO_PACKAGE: ${{ steps.identity.outputs.package }}
          JUMBO_VERSION: ${{ steps.identity.outputs.version }}
          JUMBO_BUMP: ${{ steps.identity.outputs.bump }}
          JUMBO_COMMIT: ${{ steps.coords.outputs.commit }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?the caller GITHUB_TOKEN (contents: write) is required for the release}"
          tag="v${JUMBO_VERSION}"
          asset="${{ steps.checksums.outputs.asset-name }}"
          notes="$(jq -n \
            --arg package "$JUMBO_PACKAGE" \
            --arg version "$JUMBO_VERSION" \
            --arg bump "$JUMBO_BUMP" \
            --arg commit "$JUMBO_COMMIT" \
            --arg fingerprint "$(jq -r '.publish.fingerprint' "$JUMBO_OUT/promote.json")" \
            --arg executor "$JUMBO_EXECUTOR" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '("jumbo release of **" + $package + "**\n\n- version: " + $version + " (bump: " + $bump + ")\n- commit: `" + $commit + "`\n- fingerprint: `" + $fingerprint + "`\n- executor: " + $executor + "\n- promoted by: " + $run + "\n\nChecksums in `SHA256SUMS`. The JumboIndex record for this build resolves dependencies and pins deployments.")')"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$JUMBO_COMMIT" \
            --title "${JUMBO_PACKAGE} ${JUMBO_VERSION}" \
            --notes "$notes"
          {
            echo "published=true"
            echo "tag=${tag}"
            echo "asset-url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
          } >> "$GITHUB_OUTPUT"

      # 11. Service image (opt-in, image-producing packages): build the image
      #    from the same release commit and push it to GHCR, the image
      #    registry of the standard (§3.4). The pushed digest is then
      #    verified against the registry BEFORE anything is recorded: a
      #    digest mismatch aborts the build (§3.7 failure behavior) — the
      #    index append below never runs with unverified provenance.
      - name: Resolve the GHCR image coordinates
        id: image-coords
        if: inputs.publish-image == true && steps.promote.outputs.publish_required == 'true'
        env:
          JUMBO_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          # GHCR requires lowercase image paths.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image"
          {
            echo "image=$image"
            echo "tag=$image:v${JUMBO_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (service image publication)
        if: inputs.publish-image == true && steps.promote.outputs.publish_required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (service image publication)
        if: inputs.publish-image == true && steps.promote.outputs.publish_required == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the service image to GHCR
        id: image
        if: inputs.publish-image == true && steps.promote.outputs.publish_required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-coords.outputs.tag }}

      - name: Verify the pushed image digest against the registry (§3.7)
        id: image-verify
        if: inputs.publish-image == true && steps.promote.outputs.publish_required == 'true'
        env:
          JUMBO_IMAGE_TAG: ${{ steps.image-coords.outputs.tag }}
          JUMBO_PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/jumbo-build/jumbobuild/scripts/verify_image_digest.sh" \
            --image "$JUMBO_IMAGE_TAG" \
            --expected "$JUMBO_PUSHED_DIGEST"
          # The registry-observed digest that matched the push is the only
          # value allowed into the index record.
          observed="$(docker buildx imagetools inspect "$JUMBO_IMAGE_TAG" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          echo "digest=$observed" >> "$GITHUB_OUTPUT"
          echo "::notice title=jumbo image::${JUMBO_IMAGE_TAG} verified at ${observed}"

      # 12. Append the index record per JumboIndex docs/APPEND-PROTOCOL.md:
      #    serialized fast-forward append, fetch-and-retry on non-FF,
      #    validator-gated, no history rewrites ever. imageDigest carries
      #    the verified GHCR digest when the image was pushed, else null.
      #    Authenticated with the minted installation token when the App
      #    pair is present, else the static JUNTAI_INDEX_TOKEN.
      - name: Append the index record to JumboIndex
        if: steps.release.outputs.published == 'true'
        env:
          JUMBO_INDEX_TOKEN: ${{ steps.app-token.outputs.token || secrets.JUNTAI_INDEX_TOKEN }}
          JUMBO_IMAGE_DIGEST: ${{ steps.image-verify.outputs.digest }}
        run: |
          set -euo pipefail
          build_id="${{ steps.identity.outputs.package }}-${{ steps.identity.outputs.version }}-gha${GITHUB_RUN_ID}"
          jq \
            --arg package "${{ steps.identity.outputs.package }}" \
            --arg version "${{ steps.identity.outputs.version }}" \
            --arg artifactUrl "${{ steps.release.outputs.asset-url }}" \
            --arg artifactSha256 "${{ steps.checksums.outputs.asset-sha256 }}" \
            --arg imageDigest "$JUMBO_IMAGE_DIGEST" \
            --arg buildId "$build_id" \
            --arg pipelineRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.publish as $p | {
              package: $package,
              major: $p.major,
              version: $version,
              commit: $p.commit,
              fingerprint: $p.fingerprint,
              canonicalExtract: $p.canonicalExtract,
              artifactUrl: $artifactUrl,
              artifactSha256: $artifactSha256,
              imageDigest: (if $imageDigest == "" then null else $imageDigest end),
              buildId: $buildId,
              pipelineRun: $pipelineRun,
              executor: "jumbo-publish-github-actions",
              timestamp: $timestamp
            }' "$JUMBO_OUT/promote.json" > "$JUMBO_OUT/record.json"
          cat "$JUMBO_OUT/record.json"
          python3 "$RUNNER_TEMP/jumbo-build/jumbobuild/scripts/jumbo_index_append.py" \
            --index-dir "$JUMBO_INDEX_PATH" \
            --record-file "$JUMBO_OUT/record.json" \
            --push \
            --token-env JUMBO_INDEX_TOKEN

      # 13. Opt-in public registry publication — public packages keep
      #    serving external consumers, always driven by the jumbo-computed
      #    version (set in the build step above). Credentials come only
      #    from caller secrets; nothing is published when the gate is off.
      - name: Publish to PyPI (opt-in)
        if: inputs.publish-to-public-registry == true && steps.identity.outputs.ecosystem == 'python' && steps.promote.outputs.publish_required == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          : "${UV_PUBLISH_TOKEN:?secret PYPI_TOKEN is required when publish-to-public-registry is enabled}"
          uv publish --dist-dir dist

      - name: Set up node for the npm registry (opt-in)
        if: inputs.publish-to-public-registry == true && steps.identity.outputs.ecosystem == 'npm' && steps.promote.outputs.publish_required == 'true'
        uses: actions/setup-node@v5
        with:
          registry-url: https://registry.npmjs.org

      - name: Publish to npm (opt-in)
        if: inputs.publish-to-public-registry == true && steps.identity.outputs.ecosystem == 'npm' && steps.promote.outputs.publish_required == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?secret NPM_TOKEN is required when publish-to-public-registry is enabled}"
          npm publish "dist/${{ steps.checksums.outputs.asset-name }}" --access public

      - name: Release summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## jumbo publish"
            echo
            if [[ "${{ steps.dedup.outputs.duplicate }}" == "true" ]]; then
              echo "- fingerprint hit: build skipped, recorded artifact reused (v${{ steps.dedup.outputs.reuse_version }})"
            else
              echo "- package: \`${{ steps.identity.outputs.package }}\`"
              echo "- version: \`${{ steps.identity.outputs.version }}\` (bump: ${{ steps.identity.outputs.bump }})"
              echo "- dependency artifacts materialized under deps/: ${{ steps.deps.outputs.materialized || '0' }}"
              echo "- published: ${{ steps.release.outputs.published == 'true' }}"
              if [[ -n "${{ steps.image-verify.outputs.digest }}" ]]; then
                echo "- image: \`${{ steps.image-coords.outputs.tag }}\`"
                echo "- image digest (verified): \`${{ steps.image-verify.outputs.digest }}\`"
              fi
              echo "- public registry: ${{ inputs.publish-to-public-registry }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
