name: CLI documentation

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "examples/generate-cli-docs.rs"
      - "docs/cli-reference.md"
      - ".github/workflows/cli-docs.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "examples/generate-cli-docs.rs"
      - "docs/cli-reference.md"
      - ".github/workflows/cli-docs.yml"

permissions:
  contents: read

jobs:
  verify-cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate CLI reference
        run: cargo run --locked --example generate-cli-docs
      - name: Check generated reference is current
        run: git diff --exit-code -- docs/cli-reference.md
