[project]
name = "<project-name>"
version = "1.0.0"
authors = [
    {name = "Juntai Team", email = "dev@juntai.com"}
]
description = "<description>"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.urls]
Homepage = "https://github.com/juntai/<name>"
Repository = "https://github.com/juntai/<name>.git"

###############################################################################################
# Other Dependencies
###############################################################################################

[dependency-groups]
dev = [
    "jun-build>=1.0.0",
    "pytest>=9.0.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
jun-build = { git = "https://github.com/juntai/JunBuild", branch = "main" }

###############################################################################################
# Build System
###############################################################################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/..."]

###############################################################################################
# Ruff Format & Lint
###############################################################################################

[tool.ruff]
target-version = "py310"

# Optional overrides if this project needs slightly different lint settings
[tool.ruff.lint]
extend-select = ["C4"] # Extends the root rules just for this project

###############################################################################################
# Testing
###############################################################################################

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "-q"]
pythonpath = ["src"]
