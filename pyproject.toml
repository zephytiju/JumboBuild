[project]
name = "jun-build"
version = "1.0.0"
authors = [
    {name = "Juntai Team", email = "dev@juntai.com"}
]
description = "A unified build system for Juntai developer teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21.0",
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/juntai/JunBuild"
Repository = "https://github.com/juntai/JunBuild.git"

[project.scripts]
jun-build = "jun_build.main:app"

###############################################################################################
# Other Dependencies
###############################################################################################

[dependency-groups]
test = [
    "pytest>=9.0.0",
    "pytest-cov",
]
lint = [
    "ruff>=0.4.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

###############################################################################################
# Build System
###############################################################################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/jun_build"]

###############################################################################################
# Ruff Format & Lint
###############################################################################################

[tool.ruff]
target-version = "py310"

# Optional overrides if this project needs slightly different lint settings
[tool.ruff.lint]
extend-select = ["C4"] # Extends the root rules just for this project

###############################################################################################
# Testing
###############################################################################################

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--cov=src", "--cov-report=html"]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "src/examples/*",
]
